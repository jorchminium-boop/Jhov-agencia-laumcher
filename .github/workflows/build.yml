name: Compilar Jhov Agencia Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar herramientas Android
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Descomprimir proyecto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          mkdir proyecto
          unzip -q "$ZIP_FILE" -d proyecto
          PROJECT_DIR=$(dirname "$(find proyecto -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Localizar APK
        run: |
          APK=$(find "$PROJECT_DIR" -name app-debug.apk -print -quit)
          test -n "$APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jhov-Agencia-Launcher-APK
          path: ${{ env.APK_PATH }}
